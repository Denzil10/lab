name: Wish for a build
description: Something you wish existed. Thumbs-up the ones you want most; the top ones get built.
title: "Wish: "
labels: [wishlist]
body:
  - type: textarea
    id: what
    attributes:
      label: What should exist?
      description: One thing. What would you do with it?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you use today, and what's wrong with it?
